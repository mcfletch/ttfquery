[tox]
# The Pythons `requires-python` names.  `py27,py36,py37` are all gone, and with
# `skip_missing_interpreters` a run of them skipped every cell and reported
# success having tested nothing.
envlist=typecheck,py313,py312,py311,py310,py39
skip_missing_interpreters = True

[testenv]
passenv =
    LANG
    LANGUAGE
    DISPLAY
    HOME
    USER
deps=-r{toxinidir}/test-requirements.txt
usedevelop=true
commands=pytest --cov=ttfquery --no-cov-on-fail --cov-report=term-missing {posargs:tests}

# What this package declares, checked as a consumer's checker reads it, and
# again as Windows sees it: `findsystem` reads the font directories out of the
# registry, and `winreg` is a module Linux does not have.  In `envlist`: a gate
# nothing runs is a gate that stops being true.
[testenv:typecheck]
skip_install = true
deps =
    mypy
    fonttools
commands =
    mypy
    mypy --platform win32
