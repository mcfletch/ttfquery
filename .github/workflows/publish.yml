name: Test & Publish

# Runs tests on every push and pull request. On pushes to master the package is
# built and published to PyPI via PyPI's Trusted Publisher (OIDC) mechanism.
# skip-existing means an unchanged version is silently skipped, so a push that
# does not bump ttfquery.__version__ will not fail the workflow.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system fonts
        # The findsystem / describe / glyphquery tests need real fonts installed.
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig fonts-dejavu-core fonts-liberation
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run tests
        run: pytest --cov=ttfquery --no-cov-on-fail --cov-report=term-missing tests

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Whether there is anything to publish. Asked before the upload rather than
  # left to PyPI to reject, so a push that does not bump the version is an
  # ordinary build rather than an upload nobody reads the result of.
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: check
        name: Is this version already on PyPI?
        run: |
          VERSION=$(python -c "import re,pathlib,sys; t=pathlib.Path('ttfquery/__init__.py').read_text(); m=re.search(r'^__version__\s*=\s*[\'\"]([^\'\"]+)', t, re.M); sys.exit('no __version__ in ttfquery/__init__.py') if not m else print(m.group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          PUBLISH=false
          for DIST in TTFQuery; do
            # Only 200 and 404 are answers. Anything else -- a 5xx, a timeout, a
            # DNS failure -- means PyPI did not tell us, and guessing "not
            # published" would turn an outage into an upload against a version
            # that cannot be replaced.
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 \
                   "https://pypi.org/pypi/$DIST/$VERSION/json" || echo 000)
            case "$CODE" in
              200) echo "$DIST $VERSION is already on PyPI." ;;
              404) echo "$DIST $VERSION is not on PyPI; it will be published."; PUBLISH=true ;;
              *)   echo "PyPI answered HTTP $CODE for $DIST $VERSION; refusing to guess."; exit 1 ;;
            esac
          done
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

  publish:
    needs: [build, version]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        && needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/TTFQuery/
    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
