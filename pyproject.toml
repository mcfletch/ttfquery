[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "TTFQuery"
dynamic = ["version"]
description = "FontTools-based package for querying system fonts"
readme = "README.md"
license = { file = "license.txt" }
authors = [
    { name = "Mike C. Fletcher", email = "mcfletch@users.sourceforge.net" },
]
requires-python = ">=3.9"
dependencies = [
    "fonttools",
    "numpy",
]
keywords = [
    "fonttools",
    "ttf",
    "truetype",
    "outline",
    "font",
    "curve",
    "system fonts",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
Homepage = "http://ttfquery.sourceforge.net/"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]

[project.scripts]
ttffiles = "ttfquery.ttffiles:main"
ttffamily = "ttfquery.ttffamily:main"
ttfgroups = "ttfquery.ttfgroups:main"
ttfmetadata = "ttfquery.ttfmetadata:main"

[tool.setuptools]
packages = ["ttfquery"]

[tool.setuptools.dynamic]
version = { attr = "ttfquery.__version__" }

# uv decides whether its cached metadata for a source tree is still current
# from pyproject.toml, setup.py and setup.cfg alone. This project's version
# lives in ttfquery/__init__.py, so name that file too: without it a version
# bump leaves uv answering with the previous number, and a dependent requiring
# the new one resolves against PyPI rather than this checkout.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "ttfquery/__init__.py" }]

# Named explicitly rather than left to ruff's default, which has widened
# between releases: a gate whose meaning moves when a tool is upgraded is not a
# gate. `E,W,F,B` is what the other pre-2010 projects here hold to.
[tool.openglcontext-checks]
# The OGC rules (openglcontext-checks) this project is clean of, held by
# the workspace preflight. The others join as the project reaches zero of
# each; the counts are in openglcontext/plans/DEFECT-PREVENTION.md.
select = ["OGC131", "OGC141", "OGC201", "OGC221"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "B", "PGH003", "PGH004", "PLE0604", "PLE0605",
    # A noqa that silences nothing, and an exception swallowed with no trace
    # or caught wider than what can be raised.
    "RUF100", "S110", "S112", "E722", "TRY400", "BLE001",
    # Parameters nothing reads, and datetimes with no time zone.
    "ARG", "DTZ",
    # A mutable class attribute, an import inside a function, and a private
    # name reached from another module.
    "RUF012", "PLC0415", "SLF001",
    # exec, eval, unpickling, tar extraction without a filter, and URL
    # opening of any scheme.
    "S102", "S307", "S301", "S202", "S310",
    # `X | Y` for unions where the floor allows it, and the builtin generics
    # (`dict[str, int]`) rather than their `typing` aliases.
    "UP007", "UP006", "UP035",
]
# `_name` as well as `_`: an underscore prefix is how Python says a name is
# bound but deliberately unused.
dummy-variable-rgx = "^(_[a-zA-Z0-9_]*|err)$"
ignore = [
    'E501', # long lines, kept readable by hand
]

# The package's own declarations, checked as a consumer's checker reads them.
# `check_untyped_defs` rather than `disallow_untyped_defs`: this package is
# older than annotations, and its bodies being checked is the half that finds
# defects -- the other half is a job of its own, tracked as one.
[tool.mypy]
# Named here so that `mypy` with no arguments checks the package: the tox
# environment and a developer's bare `mypy` are then the same run.
files = ["ttfquery"]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

# `findsystem` reads the Windows font directories out of the registry, and
# `winreg` is a module Linux does not have. Checked as Windows sees it in a
# second run -- see tools/preflight.toml -- so this keeps the Linux run from
# reporting nine absent names as defects.
[[tool.mypy.overrides]]
module = "ttfquery.findsystem"
disable_error_code = ["attr-defined"]
