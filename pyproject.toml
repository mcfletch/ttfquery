[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "TTFQuery"
dynamic = ["version"]
description = "FontTools-based package for querying system fonts"
readme = "README.md"
license = { file = "license.txt" }
authors = [
    { name = "Mike C. Fletcher", email = "mcfletch@users.sourceforge.net" },
]
requires-python = ">=3.7"
dependencies = [
    "fonttools",
    "numpy",
]
keywords = [
    "fonttools",
    "ttf",
    "truetype",
    "outline",
    "font",
    "curve",
    "system fonts",
]
classifiers = [
    "Programming Language :: Python",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
Homepage = "http://ttfquery.sourceforge.net/"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]

[project.scripts]
ttffiles = "ttfquery.ttffiles:main"
ttffamily = "ttfquery.ttffamily:main"
ttfgroups = "ttfquery.ttfgroups:main"
ttfmetadata = "ttfquery.ttfmetadata:main"

[tool.setuptools]
packages = ["ttfquery"]

[tool.setuptools.dynamic]
version = { attr = "ttfquery.__version__" }

# uv decides whether its cached metadata for a source tree is still current
# from pyproject.toml, setup.py and setup.cfg alone. This project's version
# lives in ttfquery/__init__.py, so name that file too: without it a version
# bump leaves uv answering with the previous number, and a dependent requiring
# the new one resolves against PyPI rather than this checkout.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "ttfquery/__init__.py" }]

# Named explicitly rather than left to ruff's default, which has widened
# between releases: a gate whose meaning moves when a tool is upgraded is not a
# gate. `E,W,F,B` is what the other pre-2010 projects here hold to.
[tool.ruff.lint]
select = ["E", "W", "F", "B"]
# `_name` as well as `_`: an underscore prefix is how Python says a name is
# bound but deliberately unused.
dummy-variable-rgx = "^(_[a-zA-Z0-9_]*|err)$"
ignore = [
    'E501', # long lines, kept readable by hand
]
